[package]
name = "oxbase-sqlite"
description = "oxbase: SQLite driver and dialect"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
oxbase-types.workspace = true
oxbase-driver.workspace = true
# M2: Fetcher / TreeLayout cells registered by `dialect::register`.
oxbase-dialect.workspace = true
# Bundled SQLite. `column_decltype` gives declared column types (type mapping by affinity);
# `hooks` gives the progress handler that makes cancellation race-free (see src/worker.rs).
rusqlite = { workspace = true, features = ["column_decltype", "hooks"] }
arrow-array.workspace = true
arrow-schema.workspace = true
async-trait.workspace = true
futures.workspace = true
# Result channel (bounded mpsc, filled from the worker thread through a cancellable send),
# oneshot replies and the cancel watcher.
tokio.workspace = true

[dev-dependencies]
tokio.workspace = true
tempfile.workspace = true
chrono.workspace = true
uuid.workspace = true
