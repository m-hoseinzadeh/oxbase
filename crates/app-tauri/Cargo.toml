[package]
name = "app-tauri"
description = "oxbase: Tauri 2 desktop shell (thin command layer; no business logic)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true

[lib]
name = "app_tauri"
path = "src/lib.rs"

[[bin]]
name = "app-tauri"
path = "src/main.rs"

[lints]
workspace = true

[build-dependencies]
tauri-build.workspace = true

[dependencies]
oxbase-types.workspace = true
oxbase-net.workspace = true
oxbase-store.workspace = true
oxbase-services.workspace = true
tauri.workspace = true
# Native file pickers (SQLite file, CA / client certificate / key files).
tauri-plugin-dialog.workspace = true
serde.workspace = true
uuid.workspace = true
arrow-array.workspace = true
arrow-schema.workspace = true
arrow-ipc.workspace = true

[dev-dependencies]
async-trait.workspace = true
oxbase-driver = { workspace = true, features = ["mock"] }
serde_json.workspace = true
tokio.workspace = true
