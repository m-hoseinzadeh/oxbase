[package]
name = "oxbase-net"
description = "oxbase: Network tunnels and TLS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true

# Not `lints.workspace = true`: `src/ssh/peer.rs` needs `unsafe` for the OS calls that tell
# which process opened a loopback connection. These are the workspace tables with `unsafe_code`
# relaxed from forbid to deny, so only code marked `#[allow(unsafe_code)]` may use it (each block
# with a `// SAFETY:` comment). Keep them in sync with the workspace manifest.
[lints.rust]
unsafe_code = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
similar_names = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
dbg_macro = "warn"
todo = "warn"

[dependencies]
oxbase-types.workspace = true
async-trait.workspace = true
# rustls with the ring provider only (see the workspace manifest).
rustls.workspace = true
rustls-native-certs.workspace = true
# SSH tunnels (src/ssh.rs and src/ssh/).
russh.workspace = true
# HMAC-SHA1 for hashed known_hosts entries (`|1|salt|hash`) and HMAC-SHA256 credential scopes.
ring.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true

# src/ssh/peer.rs: the addresses of this process's sockets (`getsockname` / `getpeername`).
[target.'cfg(unix)'.dependencies]
socket2.workspace = true

# src/ssh/peer.rs: the TCP connection table with owning process ids (`GetExtendedTcpTable`).
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_NetworkManagement_IpHelper"] }

[dev-dependencies]
futures.workspace = true
serde.workspace = true
toml.workspace = true
rcgen.workspace = true
tempfile.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
