[package]
name = "oxbase-conformance"
description = "oxbase: Cross-engine conformance harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true

[lints]
workspace = true

[[bin]]
# `cargo run -p oxbase-conformance` prints the matrix and writes target/conformance/report.json.
name = "oxbase-conformance"
path = "src/main.rs"

[dependencies]
# Engine/ObjectKind come from oxbase-types; cell applicability and fetchers from oxbase-dialect
# through oxbase_services::default_dialects (src/adapter.rs, src/fetch.rs).
oxbase-types.workspace = true
oxbase-dialect.workspace = true
# M1 connection checks (src/connect.rs) run through the real drivers and connection manager.
oxbase-driver.workspace = true
oxbase-net.workspace = true
oxbase-store.workspace = true
oxbase-services.workspace = true
futures.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
# M3 round trip (src/roundtrip/exec.rs): script captures read the first cell of a catalog answer.
arrow-array.workspace = true

[dev-dependencies]
pretty_assertions.workspace = true
# Fake fetchers in the fetch_list unit tests, over a mock connection.
async-trait.workspace = true
oxbase-driver = { workspace = true, features = ["mock"] }
# The fetch_list run on a real SQLite session (src/fetch.rs tests): seed scripts in a temp dir,
# names read from the Arrow batches.
tempfile.workspace = true
