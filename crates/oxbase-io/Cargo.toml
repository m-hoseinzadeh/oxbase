[package]
name = "oxbase-io"
description = "oxbase: Import and export"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true

[lints]
workspace = true

# Contracts: docs/m5-contracts.md §3. Every format crate stays on the workspace's arrow major
# (60): arrow-json and parquet 60.1.0.
[dependencies]
oxbase-types.workspace = true
oxbase-driver.workspace = true
oxbase-dialect.workspace = true
arrow-array.workspace = true
arrow-schema.workspace = true
arrow-cast.workspace = true
arrow-json.workspace = true
parquet.workspace = true
csv.workspace = true
encoding_rs.workspace = true
calamine.workspace = true
rust_xlsxwriter.workspace = true
async-trait.workspace = true
chrono.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio.workspace = true
tracing.workspace = true
# read stream: inspects XLSX zip entries before calamine opens them (decompressed-size caps
# against zip bombs). Same version and features as calamine's own dependency, so the lockfile
# gains no crate. To hoist into [workspace.dependencies].
zip = { version = "9.2.1", default-features = false, features = ["deflate"] }

[dev-dependencies]
pretty_assertions.workspace = true
tokio.workspace = true
# Writer tests (tests/write_*.rs): SQL dumps through each engine's real dialect cells, and the
# SQLite dump executed on an in-memory database.
oxbase-pg.workspace = true
oxbase-mysql.workspace = true
oxbase-sqlite.workspace = true
oxbase-mssql.workspace = true
rusqlite.workspace = true
# tests/write_sql_live.rs (ignored; Docker fixtures): the dumps run statement by statement.
oxbase-sql.workspace = true
# read stream: the sample-file expectations in tests/fixtures.toml [m5.files].
toml.workspace = true
