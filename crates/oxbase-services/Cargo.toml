[package]
name = "oxbase-services"
description = "oxbase: Service orchestration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
oxbase-types.workspace = true
oxbase-driver.workspace = true
oxbase-net.workspace = true
oxbase-store.workspace = true
# M2: dialect registry (tree layouts, fetchers) and the statement splitter / history redaction.
oxbase-dialect.workspace = true
oxbase-sql.workspace = true
# M3: the table designer model, validation and preview.
oxbase-designer.workspace = true
# Engine drivers registered by `default_drivers` (and, from M2, their dialect cells).
oxbase-pg.workspace = true
oxbase-mysql.workspace = true
oxbase-sqlite.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
# M2 query runs: result stores (Arrow batches, IPC spill files and pages), run temp dirs.
arrow-array.workspace = true
arrow-schema.workspace = true
arrow-ipc.workspace = true
arrow-select.workspace = true
async-trait.workspace = true
futures.workspace = true
tempfile.workspace = true

[dev-dependencies]
oxbase-driver = { workspace = true, features = ["mock"] }
pretty_assertions.workspace = true
tokio.workspace = true
# Live end-to-end tests read tests/fixtures.toml.
toml.workspace = true
