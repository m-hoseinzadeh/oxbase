# Contributor License Agreement check (see CLA.md and CONTRIBUTING.md).
#
# On each pull request, CLA Assistant checks that every commit author has signed CLA.md.
# Contributors sign by commenting the exact phrase below on the pull request. Signatures are
# stored in signatures/cla.json on the `cla-signatures` branch of this repository.
#
# Make the "CLA" status check required in branch protection for `main` so unsigned
# contributions cannot be merged.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

# The action only reads PR metadata and writes the signatures file. It never checks out or runs
# code from the pull request, so pull_request_target is safe here.
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - name: CLA Assistant
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          allowlist: m-hoseinzadeh,dependabot[bot],github-actions[bot],renovate[bot]
          lock-pullrequest-aftermerge: false
