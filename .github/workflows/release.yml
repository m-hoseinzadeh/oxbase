name: Release

# Publishes a GitHub release for a version tag.
#
# Cutting a release:
#   1. Set the same version in Cargo.toml ([workspace.package] version) and ui/package.json,
#      e.g. 0.7.0 or 0.7.0-beta.2, and land it on main through a pull request.
#   2. Tag that commit and push the tag:  git tag v0.7.0 && git push origin v0.7.0
#   3. This workflow checks the tag against both versions (scripts/release-check.mjs), builds the
#      bundles for Linux, Windows and macOS with bundle.yml, and creates the release with the
#      installers and SHA256SUMS.txt. A tag with a pre-release part (-beta.2) makes a pre-release.
#
# Dry run: run this workflow manually with `dry_run` ticked (the default). It builds the version
# in Cargo.toml from the selected branch and creates a DRAFT release named v<version>-dry-run.
# Drafts are visible only to people with write access, and no tag is created. Delete the draft
# afterwards. A manual run with `dry_run` unticked publishes the release for an existing tag.
#
# Provenance: every installer and SHA256SUMS.txt get a GitHub build provenance attestation
# (`gh attestation verify <file> --repo m-hoseinzadeh/oxbase`), and SHA256SUMS.txt is signed with
# cosign (SHA256SUMS.txt.sigstore.json). Both are keyless: Sigstore certifies this workflow's
# GitHub OIDC identity, so there is no key to keep, and a signature proves the files were built
# by this repository's release workflow from the tagged commit. Both are checked before upload.
#
# Signing: bundles are signed only when the signing secrets exist (see bundle.yml). Until then
# the release notes say the installers are unsigned. Set the repository variable
# OXBASE_REQUIRE_SIGNING=true (tag pushes) or tick `require_signing` (manual runs) to refuse to
# publish unsigned bundles.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish (ignored for a dry run)
        type: string
        default: ""
      dry_run:
        description: Build and create a draft release only (no tag, not public)
        type: boolean
        default: true
      require_signing:
        description: Fail unless the bundles are signed (and notarized on macOS)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  prepare:
    name: Check version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
      msi_version: ${{ steps.check.outputs.msi_version }}
      artifact_prefix: ${{ steps.check.outputs.artifact_prefix }}
      ref: ${{ steps.ref.outputs.ref }}
      sha: ${{ steps.check.outputs.sha }}
      dry_run: ${{ steps.ref.outputs.dry_run }}
      require_signing: ${{ steps.ref.outputs.require_signing }}
    steps:
      - name: Resolve ref
        id: ref
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_REQUIRE_SIGNING: ${{ inputs.require_signing }}
          VAR_REQUIRE_SIGNING: ${{ vars.OXBASE_REQUIRE_SIGNING }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "push" ]; then
            echo "ref=$GITHUB_REF" >> "$GITHUB_OUTPUT"
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
            echo "require_signing=$([ "$VAR_REQUIRE_SIGNING" = "true" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          elif [ "$INPUT_DRY_RUN" = "true" ]; then
            echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
            echo "require_signing=$INPUT_REQUIRE_SIGNING" >> "$GITHUB_OUTPUT"
          else
            case "$INPUT_TAG" in v*) ;; *) echo "::error::set the tag input (v<version>) or tick dry_run"; exit 1 ;; esac
            echo "ref=refs/tags/$INPUT_TAG" >> "$GITHUB_OUTPUT"
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
            echo "require_signing=$INPUT_REQUIRE_SIGNING" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.ref.outputs.ref }}
          persist-credentials: false

      - name: Check tag and versions
        id: check
        env:
          DRY_RUN: ${{ steps.ref.outputs.dry_run }}
          REF: ${{ steps.ref.outputs.ref }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then
            node scripts/release-check.mjs --dry-run
          else
            node scripts/release-check.mjs "${REF#refs/tags/}"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  bundle:
    name: Bundle
    needs: prepare
    uses: ./.github/workflows/bundle.yml
    with:
      ref: ${{ needs.prepare.outputs.ref }}
      artifact_prefix: ${{ needs.prepare.outputs.artifact_prefix }}
      msi_version: ${{ needs.prepare.outputs.msi_version }}
      require_signing: ${{ needs.prepare.outputs.require_signing == 'true' }}
    secrets: inherit

  publish:
    name: Publish release
    needs: [prepare, bundle]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      # Keyless Sigstore signing (attestations and cosign) uses the job's OIDC token.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ needs.prepare.outputs.artifact_prefix }}-*
          path: artifacts

      # Installers only: the .app bundles are inside the .dmg files.
      - name: Collect installers and checksums
        run: |
          set -euo pipefail
          mkdir dist
          find artifacts -type f \( -name '*.msi' -o -name '*-setup.exe' -o -name '*.dmg' \
            -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) -print0 |
          while IFS= read -r -d '' f; do
            name=$(basename "$f")
            if [ -e "dist/$name" ]; then echo "::error::two bundles are named $name"; exit 1; fi
            cp "$f" "dist/$name"
          done
          ls -l dist
          # 2 Windows (msi, nsis) + 2 macOS dmg + 3 Linux (deb, rpm, AppImage)
          count=$(ls dist | wc -l)
          if [ "$count" -ne 7 ]; then echo "::error::expected 7 installers, found $count"; exit 1; fi
          (cd dist && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      - name: Sign SHA256SUMS.txt (keyless)
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.txt.sigstore.json dist/SHA256SUMS.txt

      # The same checks the release notes tell users to run, so a broken signature or
      # attestation never gets published.
      - name: Verify the signature and the attestations
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          cosign verify-blob dist/SHA256SUMS.txt \
            --bundle dist/SHA256SUMS.txt.sigstore.json \
            --certificate-identity "https://github.com/$WORKFLOW_REF" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          for f in dist/*; do
            case "$f" in *.sigstore.json) continue ;; esac
            gh attestation verify "$f" --repo "$REPO" --signer-workflow "$REPO/.github/workflows/release.yml" >/dev/null
            echo "attestation ok: $(basename "$f")"
          done

      - name: Write release notes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          SIGNED: ${{ needs.prepare.outputs.require_signing }}
          SHA: ${{ needs.prepare.outputs.sha }}
          # SignPath signs the Windows installers once its project is configured (bundle.yml).
          WINDOWS_SIGNPATH: ${{ vars.SIGNPATH_PROJECT_SLUG != '' }}
        run: |
          set -euo pipefail
          {
            echo "Oxbase $VERSION, built from commit ${SHA:0:7}."
            echo
            if [ "$SIGNED" != "true" ] && [ "$WINDOWS_SIGNPATH" = "true" ]; then
              echo "> The Windows installers are code-signed (publisher: SignPath Foundation). The macOS"
              echo "> app is not signed yet: macOS blocks its first launch. Open it once, then choose"
              echo "> **Open Anyway** in System Settings → Privacy & Security (or run"
              echo "> \`xattr -dr com.apple.quarantine /Applications/Oxbase.app\`)."
              echo
            elif [ "$SIGNED" != "true" ]; then
              echo "> **Unsigned build.** These installers are not code-signed yet. macOS blocks the app's"
              echo "> first launch: open it once, then choose **Open Anyway** in System Settings → Privacy &"
              echo "> Security (or run \`xattr -dr com.apple.quarantine /Applications/Oxbase.app\`), and"
              echo "> Windows SmartScreen shows a warning (**More info → Run anyway**)."
              echo
            fi
            echo "Windows code signing: free code signing provided by [SignPath.io](https://about.signpath.io),"
            echo "certificate by [SignPath Foundation](https://signpath.org)."
            echo
            echo "| Platform | Download |"
            echo "|---|---|"
            echo "| Windows x64 | \`.msi\` or \`-setup.exe\` |"
            echo "| macOS Apple Silicon | \`_aarch64.dmg\` |"
            echo "| macOS Intel | \`_x64.dmg\` |"
            echo "| Linux x64 | \`.deb\`, \`.rpm\` or \`.AppImage\` (needs glibc 2.39+, e.g. Ubuntu 24.04, Debian 13, Fedora 40) |"
            echo
            echo "## Verify a download"
            echo
            echo "Check the checksum: \`sha256sum -c SHA256SUMS.txt --ignore-missing\`."
            echo
            echo "Every file carries a build provenance attestation: it proves the file was built by this"
            echo "repository's release workflow from commit ${SHA:0:7}. With the GitHub CLI:"
            echo
            echo '```sh'
            echo "gh attestation verify Oxbase_${VERSION}_amd64.deb --repo $GITHUB_REPOSITORY"
            echo '```'
            echo
            echo "Or check the signed checksum list with [cosign](https://docs.sigstore.dev/cosign/system_config/installation/), then the checksums:"
            echo
            echo '```sh'
            echo "cosign verify-blob SHA256SUMS.txt --bundle SHA256SUMS.txt.sigstore.json \\"
            echo "  --certificate-identity-regexp '^https://github.com/$GITHUB_REPOSITORY/\\.github/workflows/release\\.yml@refs/tags/v' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo "sha256sum -c SHA256SUMS.txt --ignore-missing"
            echo '```'
            echo
            echo "This proves where a file was built, not who wrote the code; it does not replace OS code"
            echo "signing."
            echo
            echo "[Code signing policy](https://github.com/$GITHUB_REPOSITORY#code-signing-policy)"
          } > notes.md
          cat notes.md

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          DRY_RUN: ${{ needs.prepare.outputs.dry_run }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then
            # A draft under a tag name that is never pushed, so it can't touch a real release.
            name="$TAG-dry-run"
            if gh release view "$name" >/dev/null 2>&1; then gh release delete "$name" --yes; fi
            gh release create "$name" dist/* --draft --target "$SHA" \
              --title "Oxbase $VERSION (dry run)" --notes-file notes.md
            echo "Draft release $name created; delete it when done."
            exit 0
          fi
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); else flags+=(--latest); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Re-run for the same tag: replace the files, keep the existing notes.
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --title "Oxbase $VERSION" \
              --notes-file notes.md --generate-notes "${flags[@]}"
          fi
