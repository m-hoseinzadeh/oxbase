version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels: [dependencies, rust]
    groups:
      # Arrow crates must stay on the same major.
      arrow:
        patterns: ["arrow", "arrow-*", "parquet"]
      tauri:
        patterns: ["tauri", "tauri-*"]
      cargo-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Tauri 3 is pre-release; stay on 2.x until it is deliberately adopted.
      # Minor bumps are ignored too: `tauri build` requires the `tauri`/`tauri-plugin-*`
      # crates and `@tauri-apps/api`/`@tauri-apps/plugin-*` to share major.minor, and
      # Dependabot cannot bump cargo and npm in one PR. Bump both sides by hand in one PR;
      # scripts/ci-check-tauri-versions.mjs (CI `ui` job) enforces the pairing.
      - dependency-name: "tauri"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "tauri-*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels: [dependencies, ui]
    groups:
      tauri-js:
        patterns: ["@tauri-apps/*"]
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Paired with the cargo `tauri*` ignore above; see the comment there.
      - dependency-name: "@tauri-apps/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, ci]
    groups:
      github-actions:
        patterns: ["*"]
