# pg_hba.conf for the PostgreSQL fixture (passed as -c hba_file=...). TEST-ONLY.
# First match wins.
# TYPE      DATABASE  USER        ADDRESS  METHOD

# Unix socket inside the container: used by the image's init phase and healthcheck
# (same as the image default).
local       all       all                  trust

# oxbase_tls may only connect over TLS (tests/fixtures.toml [engines.postgres.tls_user]).
hostssl     all       oxbase_tls  all      scram-sha-256
hostnossl   all       oxbase_tls  all      reject

# Everyone else: password auth, with or without TLS.
host        all       all         all      scram-sha-256
