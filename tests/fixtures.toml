# Test database fixtures — SINGLE SOURCE OF TRUTH.
#
# Read by:
#   * the Docker fixtures (tests/docker/compose.yml must match this file)
#   * the conformance harness (crates/oxbase-conformance), located via $OXBASE_FIXTURES
#     (set in .cargo/config.toml) or <repo>/tests/fixtures.toml.
#
# All containers publish on 127.0.0.1 only, host ports in 15400-15499 (verified free with
# `ss -ltn` on 2026-10-31). The last digits mirror each engine's default port.
#
# Credentials are TEST-ONLY. The password satisfies the SQL Server complexity policy
# (>= 8 chars, upper + lower + digit + symbol) and avoids characters that need escaping in
# URLs or shells, so it is shared by every engine.
#
# Image tags are pinned and were verified with `docker manifest inspect` on 2026-10-31.
# `version_query` is what the harness runs to prove the engine is up; `version_prefix` is the
# expected start of the reported server version.

schema_version = 1

[defaults]
host = "127.0.0.1"
compose_project = "oxbase-fixtures"
# Seconds the harness / compose healthchecks wait for an engine to accept connections.
startup_timeout_secs = 120

[engines.postgres]
kind = "postgres"
image = "postgres:18.6-alpine"
host = "127.0.0.1"
port = 15432
container_port = 5432
user = "oxbase"
password = "Oxbase_Fixture_Pw_2026"
database = "oxbase_test"
version_query = "SELECT version()"
version_prefix = "PostgreSQL 18.6"


# M1: a user that may only connect over TLS. pg_hba.conf: `hostssl all oxbase_tls all
# scram-sha-256` before `hostnossl all oxbase_tls all reject`. The server runs with ssl=on and
# the [tls] server certificate/key (key file mode 0600, owned by the postgres user).
[engines.postgres.tls_user]
user = "oxbase_tls"
password = "Oxbase_Fixture_Pw_2026"
database = "oxbase_test"
[engines.mysql]
kind = "mysql"
image = "mysql:8.4.13"            # 8.4 LTS
host = "127.0.0.1"
port = 15406
container_port = 3306
user = "oxbase"
password = "Oxbase_Fixture_Pw_2026"
root_password = "Oxbase_Fixture_Pw_2026"
database = "oxbase_test"
version_query = "SELECT VERSION()"
version_prefix = "8.4.13"


# M1: `CREATE USER 'oxbase_tls'@'%' ... REQUIRE SSL`, with the same grants as `oxbase` on
# oxbase_test. The server uses the [tls] CA/server certificate (--ssl-ca/--ssl-cert/--ssl-key).
[engines.mysql.tls_user]
user = "oxbase_tls"
password = "Oxbase_Fixture_Pw_2026"
database = "oxbase_test"
[engines.mariadb]
kind = "mariadb"
image = "mariadb:11.8.9"          # 11.8 LTS
host = "127.0.0.1"
port = 15407
container_port = 3306
user = "oxbase"
password = "Oxbase_Fixture_Pw_2026"
root_password = "Oxbase_Fixture_Pw_2026"
database = "oxbase_test"
version_query = "SELECT VERSION()"
version_prefix = "11.8.9-MariaDB"


# M1: `CREATE USER 'oxbase_tls'@'%' ... REQUIRE SSL`, same grants as `oxbase` on oxbase_test.
# MariaDB 11.8 also needs --ssl-ca/--ssl-cert/--ssl-key pointing at the [tls] files.
[engines.mariadb.tls_user]
user = "oxbase_tls"
password = "Oxbase_Fixture_Pw_2026"
database = "oxbase_test"
[engines.mssql]
kind = "mssql"
image = "mcr.microsoft.com/mssql/server:2025-CU10-ubuntu-24.04"
host = "127.0.0.1"
port = 15433
container_port = 1433
# SQL auth as `sa`; the fixture init creates `database` after startup (the image has no
# env var for it). Developer edition, EULA accepted in compose (ACCEPT_EULA=Y, MSSQL_PID=Developer).
user = "sa"
password = "Oxbase_Fixture_Pw_2026"
database = "oxbase_test"
version_query = "SELECT @@VERSION"
version_prefix = "Microsoft SQL Server 2025"
# M4 (docs/m4-contracts.md §5): the server presents the [tls] server certificate (mssql.conf
# `[network] tlscert/tlskey`, mounted read-only; key readable by the mssql user, uid 10001),
# accepts TLS 1.2 and 1.3, and does NOT force encryption (`forceencryption = 0`), so plain and
# `Disable` connections keep working. The M0 `trust_server_certificate = true` shortcut is gone:
# TLS checks use VerifyFull / VerifyCa with the fixture CA, like the other engines. SQL Server
# 2025 also accepts TDS 8.0 strict encryption (`options.encrypt = "strict"`) on the same port.
tds8_strict = true

# M4: a login the server accepts only over TLS. SQL Server cannot require TLS per login, so the
# fixture adds a server-level LOGON trigger (`oxbase_tls_only`) that rolls back any login of
# `oxbase_tls` whose `CONNECTIONPROPERTY('encrypt_option')` is not 'TRUE'. Same grants as `sa`
# needs for the tests on oxbase_test (db_owner there).
[engines.mssql.tls_user]
user = "oxbase_tls"
password = "Oxbase_Fixture_Pw_2026"
database = "oxbase_test"

[engines.mongodb]
kind = "mongodb"
# MongoDB 8.x refuses to start on Linux kernel 6.19+ (SERVER-121912), which GitHub's
# ubuntu-24.04 runners now use. 7.0 uses the older allocator and is unaffected. Move to 8.x
# once an image starts on the CI kernel.
image = "mongo:7.0.45"
host = "127.0.0.1"
port = 15417
container_port = 27017
user = "oxbase"
password = "Oxbase_Fixture_Pw_2026"
database = "oxbase_test"
auth_source = "admin"
# Admin command document (JSON); read `version` from the reply.
version_query = '{"buildInfo": 1}'
version_prefix = "7.0.45"
# M7 (docs/m7-contracts.md §9.1): TLS on the same port, optional for clients
# (`--tlsMode allowTLS`), so plain and TLS connections both work, like the other engines'
# servers. mongod reads one PEM holding the [tls] server certificate *and* key
# (`tls_certificate_key_file`, written by scripts/fixtures-certs.sh into [tls] dir) and the
# fixture CA (`--tlsCAFile`, `--tlsAllowConnectionsWithoutCertificates`). A wrong server name
# must fail VerifyFull; MongoDB cannot require TLS per user, so there is no tls_user.
tls_mode = "allowTLS"
tls_certificate_key_file = "server-combined.pem"

[engines.redis]
kind = "redis"
image = "redis:8.10.3-alpine"
host = "127.0.0.1"
port = 15479
container_port = 6379
# ACL default user with `requirepass`; `database` is the logical DB index.
user = "default"
password = "Oxbase_Fixture_Pw_2026"
database = "0"
# Read `redis_version` from the reply.
version_query = "INFO server"
version_prefix = "8.10.3"
# M7 (docs/m7-contracts.md §9.1): a TLS-only port next to the plain one (`--tls-port 6380`,
# `--tls-cert-file` / `--tls-key-file` = the [tls] server certificate and key,
# `--tls-ca-cert-file` = the fixture CA, `--tls-auth-clients optional`). Published on
# 127.0.0.1:15480. A plain connection to it fails; VerifyFull with the fixture CA passes.
tls_port = 15480
tls_container_port = 6380

[engines.sqlite]
kind = "sqlite"
# No container: a file created by the harness under the target dir (gitignored).
path = "target/fixtures/oxbase_test.sqlite"
version_query = "SELECT sqlite_version()"

# --- M1: TLS -------------------------------------------------------------------------------
# Test PKI, generated before the containers start (by the fixtures scripts, into the gitignored
# target dir) and mounted read-only into postgres, mysql and mariadb. One private CA signs one
# server certificate valid for every name a test may verify: direct (localhost / 127.0.0.1)
# and through the SSH bastion (the compose service names). Paths are relative to `dir`, which
# is relative to the workspace root.
[tls]
dir = "target/fixtures/tls"
ca_cert = "ca.pem"
ca_key = "ca-key.pem"
server_cert = "server.pem"
server_key = "server-key.pem"
# M4: `mssql` added (VerifyFull through the SSH bastion); scripts/fixtures-certs.sh must match.
# M7: `mongodb` and `redis` added (VerifyFull for the service names through the bastion; was
# `[m7.tls] server_sans_add` until the conformance stream changed the certificate script).
server_sans = ["localhost", "127.0.0.1", "postgres", "mysql", "mariadb", "mssql", "mongodb", "redis"]
# Client certificate for mutual-TLS tests, signed by the same CA (CN = the TLS user).
client_cert = "client.pem"
client_key = "client-key.pem"
client_cn = "oxbase_tls"
valid_days = 825

# --- M1: SSH bastion -----------------------------------------------------------------------
# One OpenSSH server inside the compose network; tests tunnel through it to the engines by
# their compose service names (`targets`). Port 15422 verified free with `ss -ltn` on
# 2026-10-31. Image tag verified with `docker manifest inspect` on 2026-10-31 (amd64 + arm64).
# The image ships `AllowTcpForwarding no`: the fixture must set it to `yes` (custom-cont-init
# script) or every tunnel fails with "administratively prohibited".
[ssh]
service = "ssh"
image = "lscr.io/linuxserver/openssh-server:10.3_p1-r1-ls240"
host = "127.0.0.1"
port = 15422
container_port = 2222
user = "oxbase"
password = "Oxbase_Fixture_Pw_2026"
# Generated before `up` into the gitignored target dir:
#  - client key pairs: `client_key` (no passphrase) and `client_key_encrypted` (passphrase
#    `client_key_passphrase`), both public keys installed as the user's authorized_keys;
#  - a fixed ed25519 host key mounted into the container, so tests can pin it;
#  - `known_hosts` with the line for "[127.0.0.1]:15422" (Strict policy tests) and
#    `host_key_fingerprint` with its SHA256:<base64> fingerprint (Fingerprint policy tests).
key_dir = "target/fixtures/ssh"
client_key = "id_ed25519"
client_key_encrypted = "id_ed25519_enc"
client_key_passphrase = "Oxbase_Fixture_Pw_2026"
host_key = "ssh_host_ed25519_key"
known_hosts = "known_hosts"
host_key_fingerprint = "host_key.fingerprint"

# How the bastion reaches each engine inside the compose network (SSH tunnel targets).
[ssh.targets]
postgres = { host = "postgres", port = 5432 }
mysql = { host = "mysql", port = 3306 }
mariadb = { host = "mariadb", port = 3306 }
mssql = { host = "mssql", port = 1433 }
# M7: MongoDB (plain or TLS on one port) and Redis (plain 6379, TLS-only 6380).
mongodb = { host = "mongodb", port = 27017 }
redis = { host = "redis", port = 6379 }
redis_tls = { host = "redis", port = 6380 }

# --- M2: seed objects for the object tree, fetchers and query runs -------------------------
# Only the NAMES live here, so the dialect streams, the conformance harness and the live tests
# agree. The objects themselves are created by each engine's init script (`init_sql`, owned by
# that engine's dialect stream) and read back by `Fetcher::list` / `Fetcher::load`.
# Unknown top-level tables are ignored by the M1 fixture readers.
#
# Shape on every engine (columns are a contract too, so `load` tests can assert them):
#   m2_parent (id integer PK, code varchar(20) NOT NULL UNIQUE, note text NULL,
#              CHECK named m2_parent_code_chk: char_length/length(code) > 0,
#              table comment "M2 parent table" where the engine has comments)
#   m2_child  (id integer PK, parent_id integer NOT NULL REFERENCES m2_parent(id)
#              ON DELETE CASCADE as FK m2_child_parent_fk, qty integer NOT NULL DEFAULT 1,
#              CHECK m2_child_qty_chk (qty >= 0), index m2_child_parent_idx (parent_id))
#   m2_view   SELECT c.id, c.qty, p.code FROM m2_child c JOIN m2_parent p ON p.id = c.parent_id
#   m2_trg    BEFORE INSERT ON m2_child, row level (sets qty to 0 when it is NULL / negative)
#   m2_fn(n integer) RETURNS integer: returns n + 1
#   m2_proc(n integer): a procedure that does nothing useful (SELECT/no-op)
#   m2_seq    START 100 INCREMENT 5
[m2]
tables = ["m2_parent", "m2_child"]
view = "m2_view"
trigger = "m2_trg"
trigger_table = "m2_child"
function = "m2_fn"
procedure = "m2_proc"
sequence = "m2_seq"
check_parent = "m2_parent_code_chk"
check_child = "m2_child_qty_chk"
foreign_key = "m2_child_parent_fk"
index = "m2_child_parent_idx"
table_comment = "M2 parent table"
# Rows for the large-result live test: `SELECT g FROM generate_series(1, 1000000) g` (PG),
# a recursive CTE elsewhere; nothing is stored.
large_result_rows = 1000000

[m2.postgres]
init_sql = "tests/docker/init/postgres/04-m2.sql"
database = "oxbase_test"
schema = "m2"
matview = "m2_mview"          # SELECT parent_id, count(*) FROM m2.m2_child GROUP BY parent_id
trigger_function = "m2_trg_fn" # RETURNS trigger, used by m2_trg
# A second database (owned by `oxbase`) with one table, to prove the tree opens a session per
# PostgreSQL database: oxbase_m2_other.public.m2_other_t (id integer PK).
other_database = "oxbase_m2_other"
other_table = "m2_other_t"
objects = ["m2_parent", "m2_child", "m2_view", "m2_mview", "m2_fn", "m2_proc", "m2_trg", "m2_seq"]

[m2.mysql]
init_sql = "tests/docker/init/mysql/04-m2.sql"
# Database = schema level: the objects live directly in oxbase_test.
database = "oxbase_test"
objects = ["m2_parent", "m2_child", "m2_view", "m2_fn", "m2_proc", "m2_trg"]

[m2.mariadb]
init_sql = "tests/docker/init/mariadb/04-m2.sql"
database = "oxbase_test"
objects = ["m2_parent", "m2_child", "m2_view", "m2_fn", "m2_proc", "m2_trg", "m2_seq"]

[m2.mssql]
# M4. Objects in schema `m2` of oxbase_test, created by init_sql (applied by the fixture's
# entrypoint wrapper, like 01-schema.sql). Differences from the shared shape: `note` is
# nvarchar(max) (text is deprecated); the check is `len(code) > 0`; the table comment is the
# MS_Description extended property; m2_trg is AFTER INSERT (SQL Server has no BEFORE triggers)
# and sets qty to 0 where the inserted qty is negative; m2_proc(@n int) runs `SELECT @n AS n`.
# A second database oxbase_m2_other with dbo.m2_other_t (id int PRIMARY KEY), like PostgreSQL,
# proves the tree opens a session per database.
init_sql = "tests/docker/init/mssql/04-m2.sql"
database = "oxbase_test"
schema = "m2"
other_database = "oxbase_m2_other"
other_table = "m2_other_t"
objects = ["m2_parent", "m2_child", "m2_view", "m2_fn", "m2_proc", "m2_trg", "m2_seq"]

[m2.sqlite]
# No container: tests apply this script to a fresh database file (tempfile), then ATTACH a
# second file as `attached_as` holding `attached_table`, to prove main + attached listing.
init_sql = "tests/docker/init/sqlite/01-m2.sql"
database = "main"
attached_as = "m2aux"
attached_table = "m2_aux_t"
# SQLite has no functions, procedures or sequences.
objects = ["m2_parent", "m2_child", "m2_view", "m2_child_parent_idx", "m2_trg"]

# --- M3: table designer round trips and grid editing ----------------------------------------
# Names only, like [m2]. Each engine stream writes its init script at [m3.<engine>].init_sql.
#
# Round-trip scratch objects (conformance `roundtrip` cells, designer live tests):
#   "<roundtrip_prefix><kind>_<token>", kind in `roundtrip_kinds`, token = 10 lowercase base36
#   characters (unix seconds and process id), so two runs never share a name and the age of a
#   leftover is readable. Each cell creates its table(s) itself, drops them in a guard that also
#   runs on failure or panic, and at start drops every "<roundtrip_prefix>*" table whose token
#   is older than `stale_after_secs` (left by a killed run). Names are bound/quoted, never
#   interpolated unquoted. A kind's cell may create a second table for foreign keys
#   ("<prefix>fk_<token>_ref").
#
# Editable seed tables (created by init_sql in `schema`/`database`; live edit tests must not
# change seed rows 1-3: they insert their own rows with code "t<token>-..." and delete them):
#   m3_edit_pk     id: integer key generated by the engine (PostgreSQL identity BY DEFAULT,
#                  MySQL/MariaDB AUTO_INCREMENT, SQLite INTEGER PRIMARY KEY), PRIMARY KEY;
#                  code varchar(20) NOT NULL UNIQUE; name text NULL; amount decimal(12,2) NULL;
#                  flag boolean NULL (MySQL/MariaDB tinyint(1), SQLite integer);
#                  born date NULL; at timestamp NULL (MySQL/MariaDB datetime(6));
#                  doc json NULL (PostgreSQL jsonb, MariaDB json = longtext, SQLite text);
#                  data bytes NULL (bytea / varbinary(64) / blob);
#                  total decimal generated always as (amount * 2) STORED (read-only cell).
#                  Seed rows id 1, 2, 3 with codes 'a', 'b', 'c' (row 3 all NULLs but code).
#   m3_edit_uq     no primary key; code varchar(20) NOT NULL UNIQUE; val integer NULL.
#                  Key = the unique code. Seed rows 'x' / 1, 'y' / 2.
#   m3_edit_nokey  a integer NULL, b text NULL, u integer NULL UNIQUE (nullable: not a key).
#                  Read-only: no key. Seed row (1, 'one', 1).
#   m3_edit_view   SELECT id, code FROM m3_edit_pk. Read-only: a view.
[m3]
roundtrip_prefix = "m3_rt_"
roundtrip_kinds = ["table", "column", "index", "foreign_key", "check"]
stale_after_secs = 3600
edit_pk_table = "m3_edit_pk"
edit_unique_table = "m3_edit_uq"
edit_nokey_table = "m3_edit_nokey"
edit_view = "m3_edit_view"
edit_seed_rows = 3

[m3.postgres]
init_sql = "tests/docker/init/postgres/05-m3.sql"
database = "oxbase_test"
# Seed tables and round-trip scratch tables live in this schema (created by init_sql).
schema = "m3"

[m3.mysql]
init_sql = "tests/docker/init/mysql/05-m3.sql"
database = "oxbase_test"

[m3.mariadb]
init_sql = "tests/docker/init/mariadb/05-m3.sql"
database = "oxbase_test"

[m3.mssql]
# M4. Seed tables in schema `m3` of oxbase_test, scratch tables too. Types: id int
# IDENTITY(1,1) PRIMARY KEY (seed rows 1-3 inserted in order); code varchar(20) NOT NULL UNIQUE;
# name nvarchar(max); amount decimal(12,2); flag bit; born date; at datetime2(6);
# doc json (SQL Server 2025 native type); data varbinary(64); total AS (amount * 2) PERSISTED.
# m3_edit_pk also has an AFTER INSERT, UPDATE, DELETE trigger m3_edit_pk_audit WITHOUT
# `SET NOCOUNT ON` that inserts one row per affected row into m3.m3_edit_audit (id int
# IDENTITY PRIMARY KEY, edit_id int, op char(1), at datetime2 DEFAULT SYSDATETIME()): the extra
# row counts and the OUTPUT restriction on tables with triggers must not break the grid
# writer's "exactly one row" check (docs/m4-contracts.md §4.5).
init_sql = "tests/docker/init/mssql/05-m3.sql"
database = "oxbase_test"
schema = "m3"

[m3.sqlite]
# Applied to a fresh temp database file, like [m2.sqlite].
init_sql = "tests/docker/init/sqlite/02-m3.sql"
database = "main"

# --- M4: SQL Server specifics ---------------------------------------------------------------
# Names only, like [m2] / [m3] (docs/m4-contracts.md §5). The fixtures stream writes
# `init_sql`; the driver, fetch and ddl streams assert these shapes in their live tests
# (crates/oxbase-mssql/tests/*.rs, #[ignore]d, run by the conformance job).
#
# Schema `m4` of oxbase_test:
#   m4_types       one column per type family, for the Arrow mapping and parameter tests:
#                  id int PRIMARY KEY, c_tinyint tinyint, c_smallint smallint, c_int int,
#                  c_bigint bigint, c_bit bit, c_decimal decimal(18,4), c_numeric numeric(38,10),
#                  c_money money, c_smallmoney smallmoney, c_float float, c_real real,
#                  c_date date, c_time time(7), c_datetime datetime, c_datetime2 datetime2(7),
#                  c_smalldatetime smalldatetime, c_dto datetimeoffset(7), c_char char(10),
#                  c_varchar varchar(50), c_varchar_max varchar(max), c_nchar nchar(10),
#                  c_nvarchar nvarchar(50), c_nvarchar_max nvarchar(max), c_text text,
#                  c_ntext ntext, c_binary binary(16), c_varbinary varbinary(64),
#                  c_varbinary_max varbinary(max), c_image image, c_guid uniqueidentifier,
#                  c_xml xml, c_json json, c_vector vector(3), c_variant sql_variant,
#                  c_hierarchyid hierarchyid, c_geometry geometry, c_geography geography,
#                  c_rowversion rowversion.
#                  Row id 1: the values of docs/m4-contracts.md §5.3 (one per column);
#                  row id 2: every column but id NULL (rowversion is never NULL).
#   m4_features    id int IDENTITY(100, 5) NOT NULL, CONSTRAINT pk_m4_features PRIMARY KEY
#                  CLUSTERED (id); code varchar(20) NULL; qty int NOT NULL CONSTRAINT
#                  df_m4_features_qty DEFAULT (1); price decimal(10,2) NOT NULL;
#                  total AS (qty * price) PERSISTED; label AS (upper(code)) (not persisted);
#                  rv rowversion; status nvarchar(10) NOT NULL CONSTRAINT df_m4_features_status
#                  DEFAULT (N'new'), CONSTRAINT ck_m4_features_qty CHECK (qty >= 0);
#                  unique filtered index m4_features_code_uq ON (code) WHERE code IS NOT NULL;
#                  nonclustered index m4_features_qty_ix ON (qty DESC) INCLUDE (price);
#                  table comment (MS_Description) "M4 features"; column comment on qty "how many".
#   m4_temporal    system-versioned: id int PRIMARY KEY, val nvarchar(20), valid_from datetime2
#                  GENERATED ALWAYS AS ROW START HIDDEN, valid_to datetime2 GENERATED ALWAYS AS
#                  ROW END HIDDEN, PERIOD FOR SYSTEM_TIME (valid_from, valid_to), history table
#                  m4.m4_temporal_history.
#   m4_iview       indexed view WITH SCHEMABINDING: SELECT id, qty FROM m4.m4_features WHERE
#                  qty > 0, with unique clustered index m4_iview_ix (id).
#   m4_view_trg    INSTEAD OF INSERT trigger on m4_iview (lists under the view's Triggers).
#   m4_itvf(@n int)  inline table-valued function: RETURNS TABLE AS RETURN SELECT ... WHERE id > @n.
#   m4_mtvf(@n int)  multi-statement table-valued function returning @t TABLE (n int).
#   m4_code_t      alias type varchar(20) NOT NULL; m4_rows_t table type (id int, name
#                  nvarchar(50)); m4_proc_tvp(@rows m4.m4_rows_t READONLY) procedure.
#   m4_messages    procedure: PRINT N'm4 print'; RAISERROR(N'm4 info', 10, 1); SELECT 1 AS a;
#                  SELECT 2 AS b; (multiple result sets; the INFO messages are a known gap).
#   m4_ddl_trg     database-level DDL trigger (FOR CREATE_TABLE, does nothing): must NOT appear
#                  under any table's Triggers folder.
[m4]
schema = "m4"
types_table = "m4_types"
features_table = "m4_features"
temporal_table = "m4_temporal"
temporal_history = "m4_temporal_history"
indexed_view = "m4_iview"
indexed_view_index = "m4_iview_ix"
view_trigger = "m4_view_trg"
inline_tvf = "m4_itvf"
multi_tvf = "m4_mtvf"
alias_type = "m4_code_t"
table_type = "m4_rows_t"
tvp_procedure = "m4_proc_tvp"
messages_procedure = "m4_messages"
ddl_trigger = "m4_ddl_trg"
# Edit-table names of [m3] reused by the mssql grid writer tests; the audit table of §[m3.mssql].
edit_audit_table = "m3_edit_audit"

[m4.mssql]
init_sql = "tests/docker/init/mssql/06-m4.sql"
database = "oxbase_test"
# The fixture CA's VerifyFull name for direct connections (the SSH target uses "mssql").
tls_server_name = "localhost"

# --- M5: import / export -------------------------------------------------------------------
# Contract: docs/m5-contracts.md §8-9. No new seed objects and no init scripts: every import or
# export test creates its own tables and drops them.
#
# Scratch tables: "<scratch_prefix><case>_<token>" (token as in [m3]: 10 lowercase base36
# characters from unix seconds and process id), created in [m5.<engine>] database / schema,
# dropped in a guard that also runs on failure or panic; at start every "<scratch_prefix>*"
# table older than `stale_after_secs` is dropped (left by a killed run). Names are quoted with
# the engine's Quoting, never interpolated raw.
#
# Sample files: tests/data/m5 (small, hand-written, committed byte for byte; .gitattributes
# turns line-end conversion off). XLSX and Parquet samples are NOT committed: tests build them
# at runtime into a temp dir (rust_xlsxwriter / parquet ArrowWriter, before the M5 writers
# exist), as listed under [m5.generated].
[m5]
data_dir = "tests/data/m5"
scratch_prefix = "m5_t_"
stale_after_secs = 3600
# Rows every engine's import / export round trip uses (generated in the test, deterministic).
roundtrip_rows = 10000

[m5.postgres]
database = "oxbase_test"
schema = "public"

[m5.mysql]
database = "oxbase_test"

[m5.mariadb]
database = "oxbase_test"

[m5.mssql]
database = "oxbase_test"
schema = "dbo"

[m5.sqlite]
# A fresh temp database file per test (like [m2.sqlite]).
database = "main"

# Expected reading of each committed sample (read stream tests; names relative to data_dir).
# rows = data rows; columns = column count; issues = row issues with default options
# (allow_ragged = true); encoding = what Auto resolves to; bom = a BOM was removed.
[m5.files."basic.csv"]
rows = 5
columns = 7
# id int, name text, amount decimal(9,2), born date (row 4 NULL), at timestamp (ISO with
# space or T, 6 fraction digits), active bool, note text. Row 3 holds a quoted LF and a
# quoted CRLF; row 4 is UTF-8 with an emoji; row 5 starts with "=" and "@" (formula guard on
# export).
types = ["int", "text", "decimal", "date", "timestamp", "bool", "text"]
encoding = "utf8"
bom = false

[m5.files."crlf.csv"]
# basic.csv with CRLF row ends; quoted line breaks inside fields kept as they are.
rows = 5
columns = 7

[m5.files."bom_utf8.csv"]
rows = 2
columns = 2
encoding = "utf8"
bom = true
values = ["é", "€"]

[m5.files."utf16le_bom.csv"]
rows = 2
columns = 2
encoding = "utf16le"
bom = true
values = ["é", "日本"]

[m5.files."utf16be_bom.csv"]
rows = 2
columns = 2
encoding = "utf16be"
bom = true
values = ["é", "日本"]

[m5.files."windows1252.csv"]
# No BOM, not UTF-8: Auto resolves to windows1252.
rows = 2
columns = 2
encoding = "windows1252"
values = ["café", "€5"]

[m5.files."latin1.csv"]
# Read with encoding = "latin1": 0x80 is U+0080 (with windows1252 it would be "€").
rows = 2
columns = 2
values = ["café", "\u0080"]

[m5.files."empty.csv"]
rows = 0
columns = 0
# The preview warns "the file is empty"; open() refuses (no columns).

[m5.files."header_only.csv"]
rows = 0
columns = 3
types = ["text", "text", "text"]

[m5.files."ragged.csv"]
# Row 2 has 2 fields (padded with NULL, no issue with allow_ragged); row 3 has 4 fields (one
# issue: extra field); with allow_ragged = false both are issues.
rows = 4
columns = 3
issues = 1

[m5.files."duplicate_headers.csv"]
columns = 4
names = ["id", "column_2", "name", "name_2"]

[m5.files."no_header.csv"]
# header = false
rows = 2
columns = 3
names = ["column_1", "column_2", "column_3"]
types = ["int", "text", "decimal"]

[m5.files."semicolon_decimal_comma.csv"]
# delimiter ";", decimal_separator ",", thousands_separator "."
rows = 2
columns = 3
types = ["int", "decimal", "decimal"]
values = ["1234.56", "-7.25"]

[m5.files."null_tokens.csv"]
# null_tokens = ["", "\\N", "NULL"]: rows 1-3 NULL, row 4 "x".
rows = 4
columns = 2
nulls = 3

[m5.files."basic.tsv"]
# CsvReadOptions::tsv(); row 1 has a quoted tab.
rows = 2
columns = 3

[m5.files."wide.csv"]
rows = 3
columns = 300

[m5.files."long_field.csv"]
# One 100 000-character field (under the 64 MiB field cap).
rows = 2
columns = 2

[m5.files."unterminated_quote.csv"]
# A quote that never closes: the field runs to the end of the file; read as one row whose
# field holds the rest of the file (rows = 1) with a warning, never a hang or an unbounded
# buffer.
rows = 1
columns = 2

[m5.files."array.json"]
# Keys in first-seen order over the sample: id, name, amount, big, flag, tags, meta, born,
# extra_late. tags / meta are json (compact text); big 9007199254740993 must survive exactly
# (int64, not a double); amount is float (1e3 is an exponent form).
rows = 3
columns = 9
types = ["int", "text", "float", "int", "bool", "json", "json", "date", "text"]

[m5.files."lines.ndjson"]
# Blank line skipped; nested values json.
rows = 3
columns = 3

[m5.files."empty_array.json"]
rows = 0
columns = 0

[m5.files."not_objects.json"]
# Elements 1 and 2 are not objects: two row issues; one row with id 3.
rows = 3
columns = 1
issues = 2

[m5.files."utf16le_bom.json"]
rows = 1
columns = 2
encoding = "utf16le"

[m5.files."truncated.json"]
# Malformed file (not a malformed value): open/next_batch fails with InvalidInput naming the
# position after row 1.
error = "invalid_input"

# Built at runtime (never committed). Each test writes its sample into a temp dir first.
[m5.generated]
# Sheets "Data" (header row 1) and "Second"; cells: integers, 1.5, booleans, a date cell
# (2001-02-03, number format yyyy-mm-dd), a date-time cell, a formula =1+2 with cached value 3
# (read as 3, never evaluated), an error cell #DIV/0! (row issue), a string "=HYPERLINK(...)"
# written with write_string (read back as text), an empty row in the middle (NULLs).
xlsx = "types.xlsx"
# Columns: id int64, price decimal128(12,2), at timestamp(us, "UTC"), day date32,
# tags list<utf8>, payload binary, note utf8 (with NULLs); 3 row groups of 1000 rows; snappy.
parquet = "types.parquet"

# The 1 GB import exit check (docs/m5-contracts.md §9). The CSV is generated on the CI
# runner into $OXBASE_PERF_DIR (never committed, deleted at the end) by the deterministic
# generator specified there; the test fails when the file is smaller than min_bytes.
[m5.perf]
rows = 10000000
min_bytes = 1000000000
# Mandatory engines; the job may add "sqlite" (a file under $OXBASE_PERF_DIR).
engines = ["postgres", "mysql"]
table = "m5_perf"
cancel_table = "m5_perf_cancel"
# The full import: TransactionPolicy::Batches { rows = commit_rows }.
commit_rows = 100000
# Progress: consecutive Progress events at most progress_max_gap_ms apart, or no more than
# progress_max_gap_fraction of the file's bytes apart; bytes and rows never go down; the last
# event before Finished reports every byte.
progress_max_gap_ms = 1500
progress_max_gap_fraction = 0.01
# RSS (Linux /proc/self/status VmRSS) may grow at most this much over its value right
# before the import starts.
rss_growth_limit_mb = 512
# Cancel run: Batches of commit_rows into cancel_table; cancel once bytes_read passes this
# fraction; the terminal Cancelled event must arrive within cancel_deadline_ms; afterwards the
# table holds exactly report.rows_committed rows (> 0).
cancel_after_fraction = 0.25
cancel_deadline_ms = 2000

# Checksum queries per engine; {table} is the qualified, quoted table name. Each returns one
# row: count, sum(id), sum(qty), count(note), sum of note lengths, sum of amount in cents. The
# generator computes the same six numbers; note length is in Unicode code points except on SQL
# Server, where it is in UTF-16 code units (DATALENGTH of nvarchar / 2).
[m5.perf.checksum]
postgres = "SELECT count(*), sum(id), sum(qty), count(note), sum(char_length(note)), sum((amount * 100)::bigint) FROM {table}"
mysql = "SELECT COUNT(*), SUM(id), SUM(qty), COUNT(note), SUM(CHAR_LENGTH(note)), SUM(CAST(amount * 100 AS SIGNED)) FROM {table}"
mariadb = "SELECT COUNT(*), SUM(id), SUM(qty), COUNT(note), SUM(CHAR_LENGTH(note)), SUM(CAST(amount * 100 AS SIGNED)) FROM {table}"
sqlite = "SELECT count(*), sum(id), sum(qty), count(note), sum(length(note)), sum(CAST(round(amount * 100) AS INTEGER)) FROM {table}"
mssql = "SELECT COUNT_BIG(*), SUM(CAST(id AS bigint)), SUM(CAST(qty AS bigint)), COUNT_BIG(note), SUM(CAST(DATALENGTH(note) / 2 AS bigint)), SUM(CAST(amount * 100 AS bigint)) FROM {table}"

# --- M6: code insight (docs/m6-contracts.md §5, §9, §11) ------------------------------------
[m6]
# Catalog reader and cache live tests create scratch objects with this prefix and a random
# token (m6_t_<token>_customer, ..._order, ..._summary, ...), drop them in a guard, and drop
# stale ones older than stale_after_secs.
scratch_prefix = "m6_t_"
stale_after_secs = 3600
# Invalidation: a designer apply, an import create or an editor DDL statement must be in the
# cache this soon after it finished.
invalidation_limit_ms = 2000

# Where each engine's live tests work. Each creates: a parent table (2-column primary key, a
# column whose name needs quotes), a child table with a foreign key to it, a view, a routine
# (PostgreSQL / MySQL / MariaDB / SQL Server), a sequence (PostgreSQL, MariaDB, SQL Server) and
# a user type (PostgreSQL enum, SQL Server alias type).
[m6.postgres]
database = "oxbase_test"
schema = "public"

[m6.mysql]
database = "oxbase_test"

[m6.mariadb]
database = "oxbase_test"

[m6.mssql]
database = "oxbase_test"
schema = "dbo"

[m6.sqlite]
# A fresh temp database file per test (like [m2.sqlite]).
database = "main"

# The 5k-table live variant (PostgreSQL only) and the latency limits of both perf tests.
[m6.perf]
schema = "m6_perf"
tables = 5000
columns_per_table = 20
# Release (`--profile perf`) limits.
build_limit_ms = 15000
reload_limit_ms = 3000
complete_p95_ms = 50
cancel_limit_ms = 5
warmup = 20
iterations = 200
limit = 200

# Cursor texts shared by the synthetic and the live perf tests. `<|>` marks the cursor;
# `{table}` / `{table2}` are two relations of the cache with a foreign key from {table2} to
# {table}; `{schema}` is a schema other than the default one. `expect` is a completion kind
# at least one returned item must have. `repeat` prepends that many copies of a 3-line filler
# statement (a long script before the cursor).
[[m6.perf.scenarios]]
name = "statement-start"
text = "<|>"
expect = "keyword"

[[m6.perf.scenarios]]
name = "from-empty"
text = "SELECT * FROM <|>"
expect = "table"

[[m6.perf.scenarios]]
name = "from-prefix"
text = "SELECT * FROM cust<|>"
expect = "table"

[[m6.perf.scenarios]]
name = "from-fuzzy"
text = "SELECT * FROM cstord<|>"
expect = "table"

[[m6.perf.scenarios]]
name = "schema-qualified"
text = "SELECT * FROM {schema}.<|>"
expect = "table"

[[m6.perf.scenarios]]
name = "select-list-prefix"
text = "SELECT cr<|> FROM {table} t"
expect = "column"

[[m6.perf.scenarios]]
name = "qualified-column"
text = "SELECT t.<|> FROM {table} t JOIN {table2} u ON u.id = t.id"
expect = "column"

[[m6.perf.scenarios]]
name = "join-target"
text = "SELECT * FROM {table} a JOIN <|>"
expect = "table"

[[m6.perf.scenarios]]
name = "join-on"
text = "SELECT * FROM {table} a JOIN {table2} b ON <|>"
expect = "column"

[[m6.perf.scenarios]]
name = "where-unqualified"
text = "SELECT * FROM {table} a, {table2} b WHERE <|>"
expect = "column"

[[m6.perf.scenarios]]
name = "insert-columns"
text = "INSERT INTO {table} (<|>"
expect = "column"

[[m6.perf.scenarios]]
name = "update-set"
text = "UPDATE {table} SET <|>"
expect = "column"

[[m6.perf.scenarios]]
name = "cte-columns"
text = "WITH x AS (SELECT id, created_at FROM {table}) SELECT x.<|> FROM x"
expect = "column"

[[m6.perf.scenarios]]
name = "function-prefix"
text = "SELECT get_<|> FROM {table}"
expect = "function"

[[m6.perf.scenarios]]
name = "long-script"
text = "SELECT t.<|> FROM {table} t"
expect = "column"
repeat = 500

# --- M7: MongoDB and Redis (docs/m7-contracts.md §9) -----------------------------------------
# Names and shapes only, like [m2] / [m3]. The conformance stream writes the init scripts
# (tests/docker/init/mongodb/02-m7.js, tests/docker/init/redis/seed-m7.redis and the cluster /
# sentinel scripts), the compose services and the certificate SANs. Live tests never change
# seed documents or keys: they write their own, named with a token (10 base36 characters from
# time and pid), and remove them in a guard; leftovers older than stale_after_secs are removed
# at start.
[m7]
stale_after_secs = 3600
# Rows the streaming checks read (find on m7_big, LRANGE / ZRANGE of the big keys, a SCAN).
large_rows = 200000

# The M7 TLS SANs (`mongodb`, `redis`) are in [tls] server_sans (and server_dns_sans of
# scripts/fixtures-certs.sh) since the conformance stream; [m7.tls] is gone.

# Database oxbase_test, created by 02-m7.js (after the M0 seed 01-seed.js; its completion marker
# fixture_meta {_id: "m7"} is part of the compose healthcheck).
#
#   m7_docs   12 documents covering every BSON type the grid maps (oxbase_dialect::document):
#             _id ObjectId (fixed hex values 65a0000000000000000000NN, NN = 01..12, so tests can
#             address them); name string "doc-NN"; n = NN, int32 in docs 1-6 and int64
#             (NumberLong) in 7-12 (one Int64 column); price Decimal128 ("12.50", "0.10", ...);
#             at Date (2026-01-01T00:00:00Z + NN days); bin BinData subtype 0 (bytes 00 ff NN);
#             uuid BinData subtype 4 (65a00000-0000-4000-8000-0000000000NN); tags array of
#             strings; meta embedded document {city (unique), zip, geo: {lat, lon}}; mixed:
#             string in doc 1, int32 in doc 2, double in doc 3, null in doc 4, object in doc 5,
#             array in doc 6, missing in 7-12 (one `mixed` column); flag bool (true in odd
#             docs); only_late: a field present only in doc 12 (outside a 10-document sample);
#             score double 1.5 * NN in every document (one Float64 column; 3.0, 6.0, ... are
#             integral doubles); big_long int64 2^53 + NN (9007199254740993 .. 9007199254741004:
#             exact only as a 64-bit integer, a JS number or relaxed-JSON double rounds it).
#             fixture_meta {_id: "m7"} has schema_version 2 since score and big_long.
#   m7_big    200 000 documents {_id: int32 1..200000, g: int32 (_id % 100), s: "row-<_id>"}
#             inserted in batches; streaming, cancel and paging checks.
#   m7_edit   3 seed documents {_id: int32 1..3, name: "seed-<n>", v: int32 n}; edit tests
#             insert their own with _id = "t<token>-<n>" (string) and never touch 1-3.
#   m7_view   view on m7_docs: [{$match: {flag: true}}, {$project: {name: 1, n: 1}}].
#   indexes   m7_docs_name_idx {name: 1}; m7_docs_tags_idx {tags: 1} (multikey);
#             m7_docs_at_ttl {at: 1} expireAfterSeconds 2147483647 (the int32 maximum the
#             server accepts, about 68 years: nothing expires); m7_big_g_idx {g: 1}; m7_docs_meta_city_uq {"meta.city": 1} unique,
#             partialFilterExpression {"meta.city": {$exists: true}}.
#   user      m7_reader (password Oxbase_Fixture_Pw_2026, roles read@oxbase_test), created
#             in admin (so the tree lists it under the admin database); role m7_role (in
#             oxbase_test: find on m7_docs).
[m7.mongodb]
init_script = "tests/docker/init/mongodb/02-m7.js"
database = "oxbase_test"
collections = ["m7_docs", "m7_big", "m7_edit"]
# The 200 000-document collection (streaming and cancel checks of the conformance harness).
big_collection = "m7_big"
view = "m7_view"
view_on = "m7_docs"
indexes = ["m7_docs_name_idx", "m7_docs_tags_idx", "m7_docs_at_ttl", "m7_docs_meta_city_uq", "m7_big_g_idx"]
user = "m7_reader"
user_password = "Oxbase_Fixture_Pw_2026"
role = "m7_role"
docs_count = 12
big_count = 200000
edit_seed_count = 3
# Shell statements the exit-check tests run (exact expected values in docs/m7-contracts.md
# §11).
shell_count = "db.m7_docs.countDocuments({})"
shell_find = "db.m7_big.find({g: 7}).sort({_id: 1}).limit(5)"
shell_aggregate = "db.m7_big.aggregate([{$group: {_id: null, total: {$sum: \"$g\"}}}])"

# Keys of database 0 unless noted, created by seed-m7.redis (after the M0 seed; its completion
# marker oxbase_test:fixture:m7_seeded and the ACL user are part of the compose healthcheck).
#
#   m7:string        "hello"                       m7:binary   bytes 00 ff fe 0a ("\x00\xff\xfe\n")
#   m7:hash          f1=v1 f2=v2 f3="grüße"         m7:list     a b c
#   m7:set           a b c                         m7:zset     a 1, b 2, c 3
#   m7:stream        2 entries 1767261600000-0 {k: v1}, 1767261600000-1 {k: v2}
#   m7:ttl           "expires" with EXPIRE 86400 (set by the seed and again by the entrypoint on
#                    every container start, so a volume older than a day still has it)
#   m7:json          {"a": 1, "b": [true, null]} with JSON.SET, only when the image loads
#                    RedisJSON (json_optional; the entrypoint logs whether it did)
#   m7:big:list      200 000 elements "e1" .. "e200000" (RPUSH in batches)
#   m7:big:zset      200 000 members "m1" .. "m200000", score = n
#   m7:ns:a:1, m7:ns:a:2, m7:ns:b:1, m7:ns:leaf    strings: the namespace tree
#                    m7: → m7:ns: → {m7:ns:a: (2 keys), m7:ns:b: (1 key), m7:ns:leaf}
#   m7:edit:seed     hash {v: 1}; edit tests write m7:edit:t<token>:* only
#   database 1:      m7:db1:key "one" (the tree lists databases 0..15 and reads db 1)
#   ACL user         m7_reader, password Oxbase_Fixture_Pw_2026, rules `on ~m7:* +@read`
#                    (set by the entrypoint on every start: ACL rules are not in the AOF)
[m7.redis]
seed_script = "tests/docker/init/redis/seed-m7.redis"
database = "0"
databases = 16
keys = ["m7:string", "m7:binary", "m7:hash", "m7:list", "m7:set", "m7:zset", "m7:stream", "m7:ttl", "m7:big:list", "m7:big:zset", "m7:ns:a:1", "m7:ns:a:2", "m7:ns:b:1", "m7:ns:leaf", "m7:edit:seed"]
json_key = "m7:json"
json_optional = true
big_list = "m7:big:list"
big_zset = "m7:big:zset"
big_count = 200000
ttl_key = "m7:ttl"
namespace_root = "m7:"
namespace_separator = ":"
db1_key = "m7:db1:key"
acl_user = "m7_reader"
acl_password = "Oxbase_Fixture_Pw_2026"
pubsub_channel = "m7:news"
pubsub_pattern = "m7:*"

# Redis Cluster: three masters, no replicas (`--cluster-replicas 0`), Redis 8.10.3. The nodes
# run with `network_mode: host` (Linux CI runners): each listens on 127.0.0.1:<port> and its
# cluster bus on <port> + 10000, and announces 127.0.0.1, so CLUSTER SLOTS answers addresses
# the tests can dial (no NAT mapping needed). `--requirepass` / `--masterauth` the fixture
# password, user default. As built (conformance stream): the three nodes are three processes of
# one container (compose service `redis-cluster`, tests/docker/init/redis/cluster.sh), which runs
# `redis-cli --cluster create ... --cluster-yes` on its first start once all three answer, then
# the seed: exactly `seed_keys` string keys m7:cluster:0 .. m7:cluster:99 (value "v<n>"), so a
# SCAN of `<key_prefix>*` over the masters returns exactly 100 keys (the earlier draft's extra
# m7:cluster:hash is not seeded). Keys are not persisted; the seed runs on every start.
# Ports 15501-15503 and 25501-25503 were free on the runner image and locally (ss -ltn,
# 2026-11-02). Health: CLUSTER INFO says cluster_state:ok on every node, and the seed marker
# oxbase_test:fixture:cluster_seeded (outside the prefix) exists.
[m7.redis_cluster]
image = "redis:8.10.3-alpine"
host = "127.0.0.1"
ports = [15501, 15502, 15503]
bus_port_offset = 10000
user = "default"
password = "Oxbase_Fixture_Pw_2026"
masters = 3
seed_keys = 100
key_prefix = "m7:cluster:"

# Redis Sentinel: one master, one replica, one sentinel (quorum 1), Redis 8.10.3,
# `network_mode: host` like the cluster so the sentinel reports an address the tests can dial.
# Master 127.0.0.1:15511 (requirepass), replica 127.0.0.1:15512 (`--replicaof 127.0.0.1 15511`,
# masterauth), sentinel 127.0.0.1:15526 (`sentinel monitor oxmaster 127.0.0.1 15511 1`,
# `sentinel auth-pass oxmaster <password>`, no password of its own: profile option
# sentinel_auth = none). Seed: m7:sentinel = "master". No failover is exercised in CI. As built:
# the three processes run in one container (compose service `redis-sentinel`,
# tests/docker/init/redis/sentinel.sh); healthy once the replica is linked, the sentinel names
# the master and the seed key is set.
[m7.redis_sentinel]
image = "redis:8.10.3-alpine"
host = "127.0.0.1"
master_port = 15511
replica_port = 15512
sentinel_port = 15526
master_name = "oxmaster"
user = "default"
password = "Oxbase_Fixture_Pw_2026"
seed_key = "m7:sentinel"

# --- M8: structure sync, data sync, transfer, backup / restore -------------------------------
# Names only, like [m2] / [m3] / [m7] (docs/m8-contracts.md §9). The conformance stream writes
# the seed scripts (`init_sql`) and the conformance cells; the transfer, structure-sync,
# data-sync and backup streams assert these shapes in their live tests (#[ignore]d, run by the
# conformance job). No new container and no port change: every engine reuses its fixture; M8
# adds databases (MySQL, MariaDB), schemas (PostgreSQL, SQL Server) and files (SQLite) only.
#
# SOURCE = the desired state, TARGET = what a sync must change. Each pair holds the same object
# set with these designed differences (portable names; per-engine types in the seed comments;
# `id` columns are the engine's identity / auto-increment):
#
#   customers      both. Source adds `phone varchar(30) NULL`; target has an extra `fax
#                  varchar(30) NULL` (a column drop: destructive); `email varchar(200) NOT NULL`
#                  with unique `customers_email_uq` on both.
#   products       both. `price` decimal(10,2) in target, decimal(12,2) in source (type change);
#                  `sku varchar(40)` NULL in target, NOT NULL in source (nullability);
#                  `stock int` DEFAULT 0 in source, no default in target (default); check
#                  `products_price_ck (price >= 0)` in source only.
#   orders         both. Index `orders_created_ix` on (created_at) in target, on (customer_id,
#                  created_at) in source (index change); FK `orders_customer_fk` (customer_id →
#                  customers.id) in source only (new FK, added last); trigger `orders_audit`
#                  (AFTER INSERT, writes into order_audit) in source only (SQLite, MySQL,
#                  MariaDB, PostgreSQL with function `orders_audit_fn`, SQL Server).
#   order_audit    both, equal (the trigger's table; proves "same" items stay out of scripts).
#   order_items    source only; `order_lines` target only, same columns: a rename-looking pair
#                  that structure sync reports as one create plus one drop (no rename guessing).
#   legacy_notes   target only (dropped only with include_drops).
#   MixedCase      source only, quoted mixed-case table with column `Value` (case-sensitive
#                  names; on PostgreSQL the target also has an unrelated `mixedcase`).
#   select         both: reserved-word table with columns `from` (int PK), `it's` (text) and
#                  `say "hi"` (text); target lacks `say "hi"` (quotes in names through DDL).
#   active_customers  view in both; source `WHERE phone IS NOT NULL`, target `WHERE 1 = 1`
#                  (view change; re-created after the tables it reads).
#   invoice_seq    sequence START 1000 INCREMENT 1 in source only (PostgreSQL, SQL Server,
#                  MariaDB); orders.id is an identity / auto-increment column on both sides.
#   order_total(p_order int)  function returning decimal, source only (PostgreSQL, MySQL,
#                  MariaDB, SQL Server).
#
# Data pairs (identical structure on both sides; data sync compares and syncs these):
#   m8_data        id bigint PK, name varchar(100) (unicode: 'grüße', '日本', an astral '😀'),
#                  amount decimal(38,10) (big: 1234567890123456789012345678.0123456789 and
#                  negatives), payload binary (bytes 00 ff 10 and NULL), happened_at timestamp
#                  with zone (PostgreSQL timestamptz, MySQL / MariaDB datetime(6) in UTC, SQL
#                  Server datetimeoffset(7) with +05:30, SQLite ISO text with offset), note text
#                  NULL. Source ids 1..20; target ids 1..18 and 21, 22; ids 3, 5, 7 differ in
#                  name / amount / happened_at; id 9 note NULL in source and 'x' in target; id 10
#                  note 'y' in source and NULL in target. Expected: inserts 2 (19, 20), updates
#                  5 (3, 5, 7, 9, 10), deletes 2 (21, 22).
#   m8_big         id bigint PK, val int, label varchar(20); source rows 1..100000 with val = id %
#                  1000, label 'row-<id>'. Target: the same except id 500 (val 9999), id 50000
#                  missing, id 100001 extra. Expected: inserts 1, updates 1, deletes 1; with a
#                  chunk size of 10 000 at least 9 chunks compare equal.
#   m8_composite   key (tenant int, code varchar(20)) PRIMARY KEY, qty int; 6 rows, (2, 'b')
#                  qty differs. Expected: updates 1.
#   m8_nokey       a int, b text; no key: refused unless key columns are chosen.
[m8]
stale_after_secs = 3600
# Scratch objects the live tests create (dropped when older than stale_after_secs).
scratch_prefix = "m8_t_"
structure_tables = ["customers", "products", "orders", "order_audit", "order_items", "order_lines", "legacy_notes", "MixedCase", "select"]
data_tables = ["m8_data", "m8_big", "m8_composite", "m8_nokey"]
view = "active_customers"
sequence = "invoice_seq"
function = "order_total"
trigger = "orders_audit"
big_table = "m8_big"
big_rows = 100000
# Expected data differences per table: [inserts, updates, deletes].
data_expected = { m8_data = [2, 5, 2], m8_big = [1, 1, 1], m8_composite = [0, 1, 0] }
# Ids of the structure diff items every engine must report (docs/m8-contracts.md §5.1 ids);
# engines without sequences / routines skip those (see per-engine `skip_items`). PostgreSQL
# routine ids carry the identity arguments: `function:order_total(integer)`
# ([m8.postgres] function_signature).
structure_items = [
  "table:customers", "table:products", "table:orders", "table:order_items",
  "table:order_lines", "table:legacy_notes", "table:MixedCase", "table:select",
  "view:active_customers", "sequence:invoice_seq", "function:order_total",
  "trigger:orders.orders_audit",
]

[m8.postgres]
init_sql = "tests/docker/init/postgres/06-m8.sql"
database = "oxbase_test"
source_schema = "m8_src"
target_schema = "m8_tgt"
# Restores go here (created empty by the seed; tests empty it first).
restore_schema = "m8_restore"
# The PG → MySQL / any-engine transfer source set (below).
transfer_schema = "m8_xfer"
# PostgreSQL routines carry their identity arguments.
function_signature = "integer"

[m8.mysql]
# Databases created by the seed (as root) with ALL privileges for the fixture user `oxbase`.
init_sql = "tests/docker/init/mysql/06-m8.sql"
source_database = "m8_src"
target_database = "m8_tgt"
restore_database = "m8_restore"
# Where the PostgreSQL transfer set lands (created empty; tests replace its tables).
transfer_target_database = "m8_xfer_target"
skip_items = ["sequence:invoice_seq"]

[m8.mariadb]
init_sql = "tests/docker/init/mariadb/06-m8.sql"
source_database = "m8_src"
target_database = "m8_tgt"
restore_database = "m8_restore"
transfer_target_database = "m8_xfer_target"

[m8.mssql]
init_sql = "tests/docker/init/mssql/07-m8.sql"
database = "oxbase_test"
source_schema = "m8_src"
target_schema = "m8_tgt"
restore_schema = "m8_restore"
transfer_target_schema = "m8_xfer_target"

[m8.sqlite]
# Two fresh temp database files per test, built from these scripts (like [m2.sqlite]); the
# restore target is a third, empty file. SQLite has no sequences or routines.
source_sql = "tests/docker/init/sqlite/03-m8-src.sql"
target_sql = "tests/docker/init/sqlite/04-m8-tgt.sql"
database = "main"
skip_items = ["sequence:invoice_seq", "function:order_total"]

# The PostgreSQL transfer source set, schema [m8.postgres] transfer_schema. Rows: 1 typical
# (unicode text, numeric 12345678901234567890.0123456789, interval '1 day 02:03:04.5', uuid
# 6f1c2a3e-0000-4000-8000-00000000abcd, jsonb {"b": [1, 2], "a": null}, array {1,2,3} /
# {"x","y,z"}, enum 'happy', timestamptz 2026-03-01 10:00:00+05:30, bytea 00 ff 0a), 1 edge
# (min / max integers, negative interval, empty strings and arrays, '😀', 1970-01-01, 23:59:59.999999),
# 1 with every column NULL except id. Tables are listed child first in the tests' transfer spec,
# so the plan must reorder them (m8_parent before m8_child; m8_tree references itself).
[m8.transfer]
source_engine = "postgres"
tables = ["m8_types", "m8_parent", "m8_child", "m8_tree"]
types_table = "m8_types"
types_rows = 3
enum_type = "m8_mood"
enum_labels = ["sad", "ok", "happy"]

# Expected MySQL 8.4 column of each m8_types column after a PG → MySQL transfer:
# [native type (as information_schema.COLUMNS.COLUMN_TYPE spells it), fidelity]. The plan's
# mapping report must say exactly this fidelity; the loaded values must read back equal
# (timestamptz as the same instant in UTC, interval / uuid / arrays as their PostgreSQL text
# or JSON form, jsonb as an equal JSON value).
[m8.transfer.expected_mysql]
id = ["int", "exact"]
c_bool = ["tinyint(1)", "exact"]
c_int2 = ["smallint", "exact"]
c_int4 = ["int", "exact"]
c_int8 = ["bigint", "exact"]
c_numeric = ["decimal(38,10)", "exact"]
c_numeric_free = ["decimal(65,30)", "narrowed"]
c_real = ["float", "exact"]
c_double = ["double", "exact"]
c_char = ["char(10)", "exact"]
c_varchar = ["varchar(255)", "exact"]
c_text = ["longtext", "exact"]
c_bytea = ["longblob", "exact"]
c_date = ["date", "exact"]
c_time = ["time(6)", "exact"]
c_timestamp = ["datetime(6)", "exact"]
c_timestamptz = ["datetime(6)", "narrowed"]
c_interval = ["varchar(64)", "widened"]
c_uuid = ["char(36)", "widened"]
c_json = ["json", "exact"]
c_jsonb = ["json", "exact"]
c_int_array = ["json", "widened"]
c_text_array = ["json", "widened"]
c_enum = ["enum('sad','ok','happy')", "exact"]
