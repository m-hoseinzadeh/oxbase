# oxbase — Rust database client. Workspace root.
# Owned by the Scaffold step. Workstreams: add crate-local deps in your own
# crate's Cargo.toml and report them for hoisting here.

[workspace]
resolver = "3"
members = [
    "crates/oxbase-types",
    "crates/oxbase-driver",
    "crates/oxbase-dialect",
    "crates/oxbase-pg",
    "crates/oxbase-mysql",
    "crates/oxbase-sqlite",
    "crates/oxbase-mssql",
    "crates/oxbase-mongo",
    "crates/oxbase-redis",
    "crates/oxbase-net",
    "crates/oxbase-sql",
    "crates/oxbase-insight",
    "crates/oxbase-schema-cache",
    "crates/oxbase-designer",
    "crates/oxbase-diff",
    "crates/oxbase-transfer",
    "crates/oxbase-io",
    "crates/oxbase-backup",
    "crates/oxbase-model",
    "crates/oxbase-bi",
    "crates/oxbase-ai",
    "crates/oxbase-jobs",
    "crates/oxbase-store",
    "crates/oxbase-services",
    "crates/oxbase-cli",
    "crates/oxbase-conformance",
    "crates/app-tauri",
]
# `cargo build` / `cargo check` with no -p skips the Tauri shell, which needs
# webkit2gtk/gtk system libraries on Linux. Use `-p app-tauri` explicitly.
default-members = [
    "crates/oxbase-types",
    "crates/oxbase-driver",
    "crates/oxbase-dialect",
    "crates/oxbase-pg",
    "crates/oxbase-mysql",
    "crates/oxbase-sqlite",
    "crates/oxbase-mssql",
    "crates/oxbase-mongo",
    "crates/oxbase-redis",
    "crates/oxbase-net",
    "crates/oxbase-sql",
    "crates/oxbase-insight",
    "crates/oxbase-schema-cache",
    "crates/oxbase-designer",
    "crates/oxbase-diff",
    "crates/oxbase-transfer",
    "crates/oxbase-io",
    "crates/oxbase-backup",
    "crates/oxbase-model",
    "crates/oxbase-bi",
    "crates/oxbase-ai",
    "crates/oxbase-jobs",
    "crates/oxbase-store",
    "crates/oxbase-services",
    "crates/oxbase-cli",
    "crates/oxbase-conformance",
]
# Vendored, patched third-party crates (see [patch.crates-io] below): never workspace members,
# so workspace lints, clippy and `cargo test --workspace` do not apply to them.
exclude = ["vendor"]

[workspace.package]
version = "1.4.0"
edition = "2024"
# tauri 2.12 requires 1.90; arrow 60 requires 1.88.
rust-version = "1.90"
license = "Apache-2.0"
publish = false
authors = ["Mohammad Hoseinzadeh <hoseinzadeh.ashraf@gmail.com>", "Oxbase contributors"]
repository = "https://github.com/m-hoseinzadeh/oxbase"
homepage = "https://github.com/m-hoseinzadeh/oxbase"

[workspace.lints.rust]
# Forbidden everywhere. A crate that truly needs `unsafe` must drop
# `lints.workspace = true`, copy these tables, relax this one line, and
# justify every `unsafe` block with a `// SAFETY:` comment.
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that are noisy for this codebase:
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
similar_names = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
# Hard rules:
dbg_macro = "warn"
todo = "warn"

[workspace.dependencies]
# --- internal crates (path + version so `x.workspace = true` works) ---
oxbase-types = { path = "crates/oxbase-types", version = "1.4.0" }
oxbase-driver = { path = "crates/oxbase-driver", version = "1.4.0" }
oxbase-dialect = { path = "crates/oxbase-dialect", version = "1.4.0" }
oxbase-pg = { path = "crates/oxbase-pg", version = "1.4.0" }
oxbase-mysql = { path = "crates/oxbase-mysql", version = "1.4.0" }
oxbase-sqlite = { path = "crates/oxbase-sqlite", version = "1.4.0" }
oxbase-mssql = { path = "crates/oxbase-mssql", version = "1.4.0" }
oxbase-mongo = { path = "crates/oxbase-mongo", version = "1.4.0" }
oxbase-redis = { path = "crates/oxbase-redis", version = "1.4.0" }
oxbase-net = { path = "crates/oxbase-net", version = "1.4.0" }
oxbase-sql = { path = "crates/oxbase-sql", version = "1.4.0" }
oxbase-insight = { path = "crates/oxbase-insight", version = "1.4.0" }
oxbase-schema-cache = { path = "crates/oxbase-schema-cache", version = "1.4.0" }
oxbase-designer = { path = "crates/oxbase-designer", version = "1.4.0" }
oxbase-diff = { path = "crates/oxbase-diff", version = "1.4.0" }
oxbase-transfer = { path = "crates/oxbase-transfer", version = "1.4.0" }
oxbase-io = { path = "crates/oxbase-io", version = "1.4.0" }
oxbase-backup = { path = "crates/oxbase-backup", version = "1.4.0" }
oxbase-model = { path = "crates/oxbase-model", version = "1.4.0" }
oxbase-bi = { path = "crates/oxbase-bi", version = "1.4.0" }
oxbase-ai = { path = "crates/oxbase-ai", version = "1.4.0" }
oxbase-jobs = { path = "crates/oxbase-jobs", version = "1.4.0" }
oxbase-store = { path = "crates/oxbase-store", version = "1.4.0" }
oxbase-services = { path = "crates/oxbase-services", version = "1.4.0" }
oxbase-conformance = { path = "crates/oxbase-conformance", version = "1.4.0" }

# --- async runtime ---
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = "0.7.20" # CancellationToken (tokio_util::sync)
futures = "0.3.34"
async-trait = "0.1.92"

# --- errors ---
thiserror = "2.0.21"
anyhow = "1.0.104"

# --- serialization / data ---
serde = { version = "1.0.229", features = ["derive"] }
# M7: `preserve_order` keeps JSON object keys in insertion order (IndexMap, already in the
# graph). MongoDB documents, sort specifications and projections are ordered: a sort of
# {"b": 1, "a": 1} differs from {"a": 1, "b": 1}, and optimistic document checks compare whole
# documents field by field in order (docs/m7-contracts.md §3.1).
serde_json = { version = "1.0.154", features = ["preserve_order"] }
toml = "1.1.8"
bytes = { version = "1.12.1", features = ["serde"] }
uuid = { version = "1.29.0", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }

# --- arrow (keep all three on the same major) ---
arrow-array = "60.1.0"
arrow-schema = { version = "60.1.0", features = ["serde"] }
arrow-ipc = "60.1.0"
# M2: `concat_batches` for result pages that span stored batches (oxbase-services).
arrow-select = "60.1.0"

# --- M5 import / export (oxbase-io; docs/m5-contracts.md §11) ---
# arrow-json and parquet stay on the arrow major above (60).
arrow-json = "60.1.0"
arrow-cast = "60.1.0"
parquet = { version = "60.1.0", default-features = false, features = ["arrow", "snap", "lz4", "zstd", "brotli", "flate2-rust_backend"] }
csv = "1.4.0"
encoding_rs = "0.8.44"
calamine = { version = "0.38.0", features = ["dates"] }
rust_xlsxwriter = { version = "0.102.0", features = ["constant_memory", "chrono"] }
# XLSX zip entries are inspected before calamine opens them (decompressed-size caps). Same
# version and features as calamine's own dependency, so the lockfile gains no crate.
zip = { version = "9.2.1", default-features = false, features = ["deflate"] }

# --- M8 backup (oxbase-backup; docs/m8-contracts.md §7) ---
# SHA-256 of every archive entry. Already in the graph (rustls / russh / mongodb), MIT OR
# Apache-2.0, so the lockfile gains no crate. arrow-ipc's `zstd` feature (enabled by
# oxbase-backup) uses zstd 0.14, also already in the graph through parquet.
sha2 = "0.11.1"

# --- observability ---
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

# --- cli ---
clap = { version = "4.6.7", features = ["derive"] }

# --- database drivers (M1) ---
# TLS everywhere is rustls with the *ring* provider (no OpenSSL, no aws-lc-rs: ring builds on
# Linux/macOS/Windows with only a C compiler, aws-lc-sys needs cmake/NASM on some hosts).
# Never enable a crate's `aws-lc-rs`/`aws_lc_rs`/`native-tls` features; `cargo tree -i openssl-sys`
# and `cargo tree -i aws-lc-sys` must stay empty.
tokio-postgres = "0.7.18"
# MakeTlsConnect for tokio-postgres over rustls (MIT). `ring` only, no bundled roots.
tokio-postgres-rustls = { version = "0.14.0", default-features = false, features = ["ring"] }
# `default-rustls-ring` = rustls-tls + tls12 + derive + pure-Rust flate2 + ring. Note: its
# rustls-tls feature always links webpki-roots (CDLA-Permissive-2.0); we turn the built-in roots
# off per connection, but deny.toml must allow that license.
mysql_async = { version = "0.37.1", default-features = false, features = ["default-rustls-ring"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
# M4: SQL Server (TDS 7.4) client, MIT OR Apache-2.0. Built WITHOUT any TLS backend: its `rustls`
# feature pulls tokio-rustls with default features (aws-lc-rs) and hard-codes the aws-lc
# provider, and `native-tls` / `vendored-openssl` are OpenSSL. oxbase-mssql runs the TLS
# handshake itself with rustls + ring (docs/m4-contracts.md §2). `tds73` = date/time/datetime2/
# datetimeoffset types; `chrono` = conversions. Never enable `rustls`, `native-tls`,
# `vendored-openssl`, `winauth`, `integrated-auth-gssapi` or the default features.
tiberius = { version = "0.13.0", default-features = false, features = ["tds73", "chrono"] }
# M7: MongoDB (docs/m7-contracts.md §2.1), Apache-2.0. `rustls-tls` is rustls + *ring*
# (`rustls/ring`, `tokio-rustls/ring`; never `rustls-tls-aws-lc` or `openssl-tls`). The driver's
# own TLS is never switched on, though: it cannot verify a server name other than the address it
# dials, has no chain-only mode and reads roots only from webpki-roots or a CA file, so
# oxbase-mongo hands it an in-process SOCKS5 dialer (`socks5-proxy`) that dials the tunnel and
# runs the TLS handshake with `oxbase_net::tls` (§2.1). `rustls-tls` is still enabled because
# the crate refuses to build without a TLS backend. `bson-3` + `compat-3-3-0` is the current
# BSON line; `dns-resolver` (hickory, MIT OR Apache-2.0) resolves `mongodb+srv://` seed lists.
mongodb = { version = "3.9.1", default-features = false, features = ["compat-3-3-0", "bson-3", "rustls-tls", "dns-resolver", "socks5-proxy"] }
# BSON values and Extended JSON v2 (relaxed / canonical) for the Arrow mapping, the document
# model and the shell helpers. MIT. Same version as mongodb's `bson-3` dependency.
bson = { version = "3.1.0", features = ["serde", "serde_json-1", "chrono-0_4", "uuid-1"] }
# M7: Redis (docs/m7-contracts.md §2.2), BSD-3-Clause. Async (tokio) multiplexed connections,
# RESP3, cluster and sentinel. TLS through `tokio-rustls-comp` (rustls with no provider feature:
# it uses the process default, which `oxbase_net::tls::install_default_crypto_provider` sets to
# ring; never `tls-native-tls`). `tls-rustls-insecure` is needed for TlsMode::Require / Prefer
# (no verification) and VerifyCa (`danger_accept_invalid_hostnames`). Sockets are mapped onto
# the SSH tunnel with the crate's `AsyncDNSResolver` hook, so TLS still verifies the server
# name. No default features (num-bigint, geospatial, script, bloom are not needed).
redis = { version = "1.8.1", default-features = false, features = ["aio", "tokio-comp", "tokio-rustls-comp", "tls-rustls-insecure", "cluster-async", "sentinel", "acl", "streams"] }
# M7: the mongo shell subset (docs/m7-contracts.md §4.2). QuickJS-ng bundled and built with `cc`
# (pre-generated bindings for x86_64/aarch64 Linux, both macOS targets and Windows MSVC; no
# bindgen, no clang needed). MIT (rquickjs and QuickJS). Only the default `std` feature: no
# module loader, no `futures`, no libc std/os modules, so scripts have no fs, net or process.
rquickjs = "0.14.0"

# --- network: TLS (rustls + ring) and SSH (russh + ring) ---
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# PEM parsing lives in rustls-pki-types (`pem::PemObject`); rustls-pemfile is superseded by it.
rustls-pki-types = { version = "1.15.1", features = ["std"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
# Platform trust store (system roots for VerifyCa/VerifyFull without a CA file).
rustls-native-certs = "0.8.5"
# SSH client (keys via `russh::keys`, which re-exports ssh-key; russh-keys is retired).
russh = { version = "0.65.0", default-features = false, features = ["ring", "flate2", "rsa"] }
# HMAC for hashed known_hosts entries and credential scoping in oxbase-net. Already in the graph
# through rustls and russh (Apache-2.0 AND ISC).
ring = "0.17.14"

# --- platform ---
# Platform config directory for the profile file (oxbase-store; MIT OR Apache-2.0).
dirs = "7.0.0"
# Safe wrapper for the effective user id behind the private spill directory checks
# (oxbase-types, Unix only). Already in the graph through tempfile (Apache-2.0 WITH
# LLVM-exception OR Apache-2.0 OR MIT).
rustix = "1.1.6"
# Socket addresses of this process's descriptors and the Windows TCP connection table, which
# tell whether an SSH tunnel's loopback peer is Oxbase itself (oxbase-net). Both already in the
# graph through tokio (MIT OR Apache-2.0).
socket2 = "0.6.5"
windows-sys = "0.61.2"

# --- secrets ---
# keyring 4 `v1` (default): macOS Keychain, Windows Credential Manager, Secret Service over zbus
# with pure-Rust crypto on Linux/BSD (no libdbus, no OpenSSL). API: keyring::Entry.
keyring = "4.2.0"

# --- app shell (Tauri 2; 3.x is alpha, do not bump) ---
tauri = "2.12.5"
tauri-build = "2.7.4"
# Native file pickers; keep on the same major.minor as @tauri-apps/plugin-dialog in ui/.
tauri-plugin-dialog = "2.8.4"
# 1.3: one running instance; a second launch hands its files to it.
tauri-plugin-single-instance = "2.5.4"

# --- dev / test ---
tokio-test = "0.4.6"
pretty_assertions = "1.4.1"
rstest = "0.28.0"
# Test certificates (ring backend, matches the workspace provider).
rcgen = "0.14.10"
# Temp dirs in tests; from M2 also a normal dependency of oxbase-services (per-run result
# spill directories, deleted on drop).
tempfile = "3.27.0"

[profile.dev]
# Keep the shared target dir small: line tables only, no full debuginfo.
debug = "line-tables-only"

[profile.dev.package."*"]
# Dependencies get light optimization; workspace crates stay at opt-level 0.
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 16

# Patched third-party crates. tiberius 0.13.0 decodes `money` / `smallmoney` through `f64`, which
# rounds amounts above about 9.007e11; the vendored copy decodes them to an exact scale-4
# `Numeric` (one function, see vendor/tiberius/OXBASE.md). Drop this once upstream decodes money
# exactly or the own TDS decoder (docs/m4-contracts.md §11) replaces tiberius.
#
# tokio-postgres 0.7.18 and mysql_async 0.37.1 send the password to whatever server asks for it
# (PostgreSQL cleartext / MD5, MySQL caching_sha2_password full auth). The vendored copies add one
# switch each (`password_disclosure`) that oxbase-pg / oxbase-mysql turn off unless the server
# certificate is verified (audit lead 5; see vendor/<crate>/OXBASE.md). Drop them once upstream
# can refuse those exchanges itself.
[patch.crates-io]
tiberius = { path = "vendor/tiberius" }
tokio-postgres = { path = "vendor/tokio-postgres" }
mysql_async = { path = "vendor/mysql_async" }

# M5: the 1 GB import exit check (docs/m5-contracts.md §9) runs optimized, without the slow
# fat LTO link: `cargo test -p oxbase-services --profile perf --test import_perf`.
[profile.perf]
inherits = "release"
lto = false
codegen-units = 16
